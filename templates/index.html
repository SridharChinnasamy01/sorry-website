<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f5);
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 450px;
            padding: 45px 30px;
            text-align: center;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        .heart {
            font-size: 65px;
            animation: beat 1.2s infinite;
        }

        h1 {
            color: #e91e63;
            margin: 20px 0 15px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        .buttons {
            position: relative;
            width: 100%;
            height: 100px;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .yes {
            background: #e91e63;
            color: white;
        }

        .yes:hover {
            background: #c2185b;
        }

        .no {
            position: absolute;
            left: 55%;
            top: 0;
            background: #f5f5f5;
            color: #555;
            transition: 0.2s;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>I'm Sorry</h1>

        <p>
            Naan apdi kettathu thappu than.<br>
            Please....Sorry.<br>
            Can you please forgive me?
        </p>

        <div class="buttons">

            <button class="yes" onclick="acceptSorry()">
                Yes ❤️
            </button>

            <button class="no" id="noButton">
                No 😢
            </button>

        </div>

    </div>

    <script>
        function acceptSorry() {
            window.location.href = "/date";
        }

        const noButton = document.getElementById("noButton");

        function moveNoButton() {
            const container = document.querySelector(".buttons");

            const maxX = container.clientWidth - noButton.offsetWidth;
            const maxY = container.clientHeight - noButton.offsetHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";
        }

        noButton.addEventListener("mouseenter", moveNoButton);
        noButton.addEventListener("touchstart", moveNoButton);
        noButton.addEventListener("click", moveNoButton);
    </script>

</body>
</html>
