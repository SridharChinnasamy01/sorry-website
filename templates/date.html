<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Date ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f5);
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 450px;
            padding: 45px 30px;
            text-align: center;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        .heart {
            font-size: 65px;
        }

        h1 {
            color: #e91e63;
            margin: 20px 0 15px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .buttons {
            position: relative;
            height: 100px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .yes {
            background: #e91e63;
            color: white;
        }

        .yes:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        .no {
            position: absolute;
            left: 55%;
            top: 0;
            background: #f5f5f5;
            color: #555;
            transition: 0.2s;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">🌸</div>

        <h1>One More Question...</h1>

        <p>
            Thank you for forgiving me ❤️<br>
            Will you go on a date with me?
        </p>

        <form action="/success" method="POST">

            <input
                type="date"
                name="selected_date"
                required
            >

            <div class="buttons">

                <button type="submit" class="yes">
                    Yes 💕
                </button>

                <button type="button" class="no" id="noButton">
                    No 😢
                </button>

            </div>

        </form>

    </div>

    <script>
        const noButton = document.getElementById("noButton");

        function moveNoButton() {
            const container = document.querySelector(".buttons");

            const maxX = container.clientWidth - noButton.offsetWidth;
            const maxY = container.clientHeight - noButton.offsetHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";
        }

        noButton.addEventListener("mouseenter", moveNoButton);
        noButton.addEventListener("touchstart", moveNoButton);
        noButton.addEventListener("click", moveNoButton);
    </script>

</body>
</html>
